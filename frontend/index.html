<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Leash: a spending limit for AI shopping agents</title>
    <meta name="description" content="Tell an AI shopping agent how much it may spend, on what, and where. Leash checks every purchase against your signed rules and shows you why it said yes, asked you, or said no." />
    <meta name="theme-color" content="#F7FAFF" />
    <style>
      html, body { margin: 0; background: #F7FAFF; }
      .boot { position: relative; min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 1.25rem; overflow: hidden; color: #26262B; font-family: system-ui, sans-serif; }
      .boot::before { content: ""; position: absolute; inset: 0; background: radial-gradient(46vw 40vw at 20% 16%, #FCE7A6, transparent 70%), radial-gradient(40vw 36vw at 6% 74%, #F9D3D8, transparent 70%), radial-gradient(46vw 40vw at 70% 56%, #DDD9FA, transparent 70%); }
      .boot > * { position: relative; }
      .boot-mark { width: 4.5rem; height: 4.5rem; overflow: visible; }
      .boot-ring, .boot-tether { fill: none; stroke: #26262B; stroke-width: 3; stroke-linecap: round; }
      .boot-ring { stroke-dasharray: 57; stroke-dashoffset: 57; animation: boot-draw 1.1s ease-out forwards, boot-pulse 2.4s ease-in-out 1.2s infinite; transform-origin: 13px 19px; }
      .boot-tether { stroke-dasharray: 9; stroke-dashoffset: 9; animation: boot-draw 0.4s ease-out 0.9s forwards; }
      .boot-handle { fill: #FFD35C; stroke: #26262B; stroke-width: 2; opacity: 0; transform-origin: 26px 6px; animation: boot-pop 0.35s ease-out 1.2s forwards; }
      .boot-word { font-size: 1.75rem; font-weight: 800; letter-spacing: 0.01em; }
      .boot-bar { width: 9rem; height: 0.375rem; overflow: hidden; border-radius: 999px; background: #D9E0EC; }
      .boot-bar::after { content: ""; display: block; width: 40%; height: 100%; border-radius: 999px; background: #26262B; animation: boot-slide 1.2s ease-in-out infinite; }
      @keyframes boot-draw { to { stroke-dashoffset: 0; } }
      @keyframes boot-pop { 0% { opacity: 0; transform: scale(0.4); } 100% { opacity: 1; transform: scale(1); } }
      @keyframes boot-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
      @keyframes boot-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .boot *, .boot::before { animation: none !important; } .boot-ring, .boot-tether { stroke-dashoffset: 0; } .boot-handle { opacity: 1; } }
    </style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://leash-api.onrender.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Leash" />
    <meta property="og:title" content="Leash: a spending limit for AI shopping agents" />
    <meta property="og:description" content="Your agent shops. Your rules decide. Every purchase is approved, escalated to you, or blocked, with the reason on record." />
    <meta name="twitter:card" content="summary" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Leash",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Any",
        "description": "A spending limit for AI shopping agents. Write a rule in plain English, and every purchase an agent proposes is checked against it before PayPal is called.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading Leash">
        <svg class="boot-mark" viewBox="0 0 32 32" aria-hidden="true">
          <circle class="boot-ring" cx="13" cy="19" r="9" />
          <path class="boot-tether" d="M19.5 12.5 L25.5 6.5" />
          <circle class="boot-handle" cx="26" cy="6" r="3.5" />
        </svg>
        <span class="boot-word">Leash</span>
        <span class="boot-bar" aria-hidden="true"></span>
      </div>
    </div>
    <noscript>
      <h1>Leash</h1>
      <p>Leash is a spending limit for AI shopping agents. It needs JavaScript to run. Every purchase an agent proposes is checked against your signed rules, then approved, escalated to you, or blocked, with the reason recorded.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
