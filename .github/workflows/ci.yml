name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: leash
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/leash
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else
      MANDATE_SIGNING_KEY: ci-only-signing-key-not-used-anywhere-else
      DEBUG: "true"
      ALLOWED_HOSTS: localhost,127.0.0.1
      FRONTEND_URL: http://localhost:5173
      DEMO_MODE: "true"
      NUM_PROXIES: "1"
      PAYPAL_CLIENT_ID: ci-dummy-client-id
      PAYPAL_CLIENT_SECRET: ci-dummy-client-secret
      PAYPAL_BASE_URL: https://api-m.sandbox.paypal.com
      LLM_PROVIDER: gemini
      LLM_API_KEY: ci-dummy-key
      LLM_MODEL: ci-dummy-model
      PRODUCT_SEARCH_PROVIDER: seeded
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t leash .
