<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" role="img" aria-label="Leash architecture: the AI proposes, deterministic code decides" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#26262B"/></marker></defs>
<rect width="1000" height="680" fill="#F7FAFF"/>
<text x="500" y="34" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#26262B">Leash: the AI proposes, deterministic code decides</text>
<text x="20" y="66" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#26262B">1. Set the rule</text>
<rect x="20" y="78" width="190" height="76" rx="12" fill="#FFFFFF" stroke="#26262B" stroke-width="2"/>
<text x="115.0" y="102.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#26262B">You</text>
<text x="115.0" y="121.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#26262B">write a rule in</text>
<text x="115.0" y="140.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#26262B">plain English</text>
<rect x="250" y="78" width="230" height="76" rx="12" fill="#D6D3F5" stroke="#26262B" stroke-width="2"/>
<text x="365.0" y="102.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#26262B">Mandate parser</text>
<text x="365.0" y="121.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#26262B">Gemini tool call returns</text>
<text x="365.0" y="140.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#26262B">structured limits</text>
<rect x="520" y="78" width="190" height="76" rx="12" fill="#FFFFFF" stroke="#26262B" stroke-width="2"/>
<text x="615.0" y="111.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#26262B">You confirm</text>
<text x="615.0" y="130.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#26262B">the limits</text>
<rect x="750" y="78" width="230" height="76" rx="12" fill="#B7CEF4" stroke="#26262B" stroke-width="2"/>
<text x="865.0" y="102.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#26262B">Server signs</text>
<text x="865.0" y="121.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#26262B">HMAC-SHA256, stored</text>
<text x="865.0" y="140.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#26262B">in PostgreSQL</text>
<line x1="210" y1="116" x2="248" y2="116" stroke="#26262B" stroke-width="2" marker-end="url(#a)"/>
<line x1="480" y1="116" x2="518" y2="116" stroke="#26262B" stroke-width="2" marker-end="url(#a)"/>
<line x1="710" y1="116" x2="748" y2="116" stroke="#26262B" stroke-width="2" marker-end="url(#a)"/>
<text x="20" y="214" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#26262B">2. The agent shops and every proposal is checked</text>
<rect x="20" y="228" width="230" height="86" rx="12" fill="#D6D3F5" stroke="#26262B" stroke-width="2"/>
<text x="135.0" y="257.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#26262B">Shopping agent</text>
<text x="135.0" y="276.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#26262B">Gemini tools and Channel3</text>
<text x="135.0" y="295.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#26262B">search, propose a cart</text>
<rect x="290" y="228" width="230" height="86" rx="12" fill="#B7CEF4" stroke="#26262B" stroke-width="2"/>
<text x="405.0" y="257.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#26262B">Server</text>
<text x="405.0" y="276.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#26262B">submit_proposal looks up</text>
<text x="405.0" y="295.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#26262B">real prices, locks the mandate</text>
<rect x="560" y="228" width="270" height="86" rx="12" fill="#FFD35C" stroke="#26262B" stroke-width="4"/>
<text x="695.0" y="257.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#26262B">Policy engine</text>
<text x="695.0" y="276.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#26262B">pure Python, integer cents</text>
<text x="695.0" y="295.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#26262B">no AI, no network</text>
<line x1="250" y1="271" x2="288" y2="271" stroke="#26262B" stroke-width="2" marker-end="url(#a)"/>
<line x1="520" y1="271" x2="558" y2="271" stroke="#26262B" stroke-width="2" marker-end="url(#a)"/>
<line x1="865" y1="154" x2="740" y2="226" stroke="#26262B" stroke-width="2" marker-end="url(#a)"/>
<text x="830" y="196" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#565C6B">signed limits</text>
<text x="20" y="336" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#565C6B">Product page text is untrusted</text>
<text x="20" y="353" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#565C6B">and cannot trigger a purchase</text>
<text x="20" y="404" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#26262B">3. The decision</text>
<rect x="330" y="418" width="190" height="70" rx="12" fill="#DDF3E8" stroke="#26262B" stroke-width="2"/>
<text x="425.0" y="448.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#26262B">approve</text>
<text x="425.0" y="467.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#26262B">create PayPal order</text>
<rect x="560" y="418" width="190" height="70" rx="12" fill="#FFEBC2" stroke="#26262B" stroke-width="2"/>
<text x="655.0" y="448.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#26262B">escalate</text>
<text x="655.0" y="467.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#26262B">you approve or deny</text>
<rect x="790" y="418" width="190" height="70" rx="12" fill="#FDE0DE" stroke="#26262B" stroke-width="2"/>
<text x="885.0" y="448.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#26262B">block</text>
<text x="885.0" y="467.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#26262B">rule ids and reasons</text>
<line x1="640" y1="314" x2="425" y2="416" stroke="#26262B" stroke-width="2" marker-end="url(#a)"/>
<line x1="695" y1="314" x2="655" y2="416" stroke="#26262B" stroke-width="2" marker-end="url(#a)"/>
<line x1="750" y1="314" x2="885" y2="416" stroke="#26262B" stroke-width="2" marker-end="url(#a)"/>
<rect x="330" y="548" width="190" height="76" rx="12" fill="#FFFFFF" stroke="#26262B" stroke-width="2"/>
<text x="425.0" y="572.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#26262B">PayPal sandbox</text>
<text x="425.0" y="591.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#26262B">buyer approves, server</text>
<text x="425.0" y="610.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#26262B">captures once</text>
<line x1="425" y1="488" x2="425" y2="546" stroke="#26262B" stroke-width="2" marker-end="url(#a)"/>
<line x1="560" y1="468" x2="522" y2="572" stroke="#26262B" stroke-width="2" marker-end="url(#a)"/>
<text x="470" y="528" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#565C6B">if approved</text>
<rect x="640" y="548" width="340" height="76" rx="12" fill="#FFFFFF" stroke="#26262B" stroke-width="2"/>
<text x="810.0" y="581.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#26262B">Audit log</text>
<text x="810.0" y="600.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#26262B">every decision with the rules that fired</text>
<line x1="885" y1="488" x2="885" y2="546" stroke="#26262B" stroke-width="2" marker-end="url(#a)"/>
<line x1="655" y1="488" x2="730" y2="546" stroke="#26262B" stroke-width="2" marker-end="url(#a)"/>
<text x="500" y="660" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#565C6B">Sandbox money only. The model never holds spending authority.</text>
</svg>