services:
  - type: web
    name: leash-api
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health/
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: MANDATE_SIGNING_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: DEMO_MODE
        value: "true"
      - key: NUM_PROXIES
        value: "1"
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MAX_RETRIES
        value: "1"
      - key: AGENT_STRATEGY
        value: planned
      - key: PRODUCT_SEARCH_PROVIDER
        value: channel3
      - key: CHANNEL3_API_KEY
        sync: false
